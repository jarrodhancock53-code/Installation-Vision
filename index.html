<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BuildLens</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0b0f14; --panel:#151b23; --panel2:#1d2530; --line:#2c3644; --text:#eef2f6; --muted:#9aa7b6;
  --accent:#22c55e; --accent-ink:#04210f; --cyan:#06b6d4; --amber:#f59e0b; --red:#ef4444; --blue:#60a5fa;
  --radius:12px; --tap:48px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;padding-bottom:160px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(11,15,20,.95);border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:var(--tap);min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);padding:0 12px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:16px}
h2{font-size:20px;margin:8px 0 12px}
h3{font-size:16px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
p{margin:8px 0}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{min-height:var(--tap);border-radius:var(--radius);border:1px solid var(--line);background:var(--panel2);padding:10px 16px;cursor:pointer;font-weight:600;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--red);color:#fecaca}
.btn.block{display:block;width:100%}
.btn.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:14px 16px}
.btn.choice.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(11,15,20,.97);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .inner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar .sec{display:flex;gap:8px}
.bar .sec .btn{flex:1;min-height:44px;font-weight:500;padding:8px}
label.f{display:block;margin:12px 0 4px;font-weight:600}
input[type=text],input[type=password],input[type=number],input[type=url],select{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 10px;font-size:14px}
.chip.g{border-color:var(--accent)} .chip.a{border-color:var(--amber)} .chip.c{border-color:var(--cyan)} .chip.r{border-color:var(--red)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000}
.thumb img{display:block;width:100%;height:120px;object-fit:contain}
.thumb .n{position:absolute;left:4px;top:4px;background:rgba(0,0,0,.7);border-radius:6px;padding:0 6px;font-size:12px}
.thumb .acts{display:flex}
.thumb .acts button{flex:1;min-height:36px;border:0;border-top:1px solid var(--line);background:var(--panel);cursor:pointer}
.stage{position:relative;margin:0 -16px;background:#000}
.stage canvas{display:block;margin:0 auto;touch-action:manipulation}
.inset{position:absolute;left:8px;bottom:8px;width:30%;max-width:220px;border:2px solid #fff;border-radius:8px;background:#fff;cursor:zoom-in}
.inset img{display:block;width:100%}
.instr{font-size:19px;line-height:1.35;font-weight:600;margin:10px 0}
.banner{border-radius:var(--radius);padding:12px 14px;margin:10px 0;font-weight:600}
.banner.ok{background:#0f3d22;border:1px solid var(--accent)}
.banner.bad{background:#3d1212;border:1px solid var(--red)}
.banner.warn{background:#3a2a07;border:1px solid var(--amber)}
.banner.info{background:#0c2a3a;border:1px solid var(--cyan)}
.steps-nav{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.phases{display:flex;gap:4px;margin:6px 0 10px}
.phases span{flex:1;text-align:center;font-size:13px;padding:4px 0;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.phases span.on{border-color:var(--accent);color:var(--text);font-weight:700}
.phases span.done{color:var(--accent)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--radius);margin:8px 0;background:var(--panel);cursor:pointer}
.check input{width:26px;height:26px;flex:none;margin:2px 0 0;accent-color:var(--accent)}
.check b{display:block}
table.log{width:100%;border-collapse:collapse;font-size:13px}
table.log th,table.log td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.tablewrap{overflow-x:auto}
#busy{position:fixed;inset:0;z-index:50;background:rgba(5,8,12,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
#busy[hidden],#modal[hidden]{display:none}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#busyText{font-size:18px;font-weight:600;max-width:420px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(5,8,12,.8);display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:760px;max-height:90vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
#modal .sheet.full{max-height:100vh;height:100vh;border-radius:0;padding:0;background:#000;display:flex;flex-direction:column}
#modal .sheet.full img{max-width:100%;max-height:calc(100vh - 60px);object-fit:contain;margin:auto;display:block}
.fb{display:flex;align-items:center;gap:8px;margin:8px 0}
.fb button{min-height:40px;min-width:56px}
.fb button.sel{border-color:var(--accent);background:#0f3d22}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
ul.plain{padding-left:20px;margin:6px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
</style>
</head>
<body>
<header class="top">
  <button class="iconbtn" id="homeBtn" aria-label="Home">⌂</button>
  <h1 id="title">BuildLens</h1>
  <button class="iconbtn" id="logBtn" aria-label="Session log">Log</button>
  <button class="iconbtn" id="setBtn" aria-label="Settings">⚙</button>
</header>
<main id="app"></main>
<div class="bar" id="bar" hidden><div class="inner" id="barInner"></div></div>
<div id="busy" hidden role="alertdialog" aria-live="polite">
  <div class="spinner"></div>
  <div id="busyText">Working…</div>
  <div id="busySub" class="muted small"></div>
  <button class="btn" id="busyCancel">Cancel</button>
</div>
<div id="modal" hidden></div>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="fileIn" accept="image/*,application/pdf" multiple hidden>

<script type="module">
// ======================================================================
// BuildLens — photo-by-photo assembly coach. Single file, no build step.
// ======================================================================
const PDFJS_URL = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs';
const PDFJS_WORKER = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs';
const API_URL = 'https://api.anthropic.com/v1/messages';
const API_VERSION = '2026-10-21';
const MAX_EDGE = 2576;        // current models' image limit; coordinates map 1:1
const PAGE_EDGE = 1800;       // manual pages
const CROP_EDGE = 512;        // inventory reference crops
const RANGE_OVER = 40;        // ask for a page range above this
const MAX_PAGES = 60;         // per parse call (keeps the request under the API's 32 MB limit)
const MAX_BODY = 30e6;
const LOW_CONF = 0.5;
const FALLBACK_MODELS = new Set(['claude-opus-5-5', 'claude-sonnet-5-5']);
const MODEL_OPTIONS = ['claude-opus-5-5', 'claude-sonnet-5-5', 'claude-haiku-5-5'];
const DEFAULT_PRICES = { // USD per million tokens [input, output]
  'claude-opus-5-5': [4, 20], 'claude-sonnet-5-5': [2, 10], 'claude-haiku-5-5': [0.10, 0.50],
};
const TECH_URL = 'https://cert.safekids.org/';
const CATEGORY_LABEL = { car_seat: 'Car seat', furniture: 'Furniture', generic: 'Other product' };
const JOB_LABEL = { install: 'First install', move: 'Move to another car', check: 'Check an existing install', convert: 'Convert mode' };

// ---------------------------------------------------------------- utils
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

class UserError extends Error {}

}
const money = v => '$' + (v < 0.01 ? v.toFixed(4) : v.toFixed(2));

// ---------------------------------------------------------------- settings
const SETTINGS_KEY = 'bl:settings';
const Settings = {
  defaults() {
    return {
      conn: 'direct', apiKey: '', proxyUrl: '', passcode: '',
      models: { parse: 'claude-opus-5-5', inventory: 'claude-sonnet-5-5', step: 'claude-sonnet-5-5', check: 'claude-sonnet-5-5' },
      prices: { ...DEFAULT_PRICES },
    };
  },
  load() {
    let s = null;
    try { s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || 'null'); } catch { s = null; }
    const d = this.defaults();
    if (!s) return d;
    return { ...d, ...s, models: { ...d.models, ...(s.models || {}) }, prices: { ...d.prices, ...(s.prices || {}) } };
  },
  save(s) { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch (e) { console.warn(e); } },
  ready(s = this.load()) { return s.conn === 'proxy' ? !!(s.proxyUrl && s.passcode) : !!s.apiKey; },
};
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.warn(e); } };

// ---------------------------------------------------------------- IndexedDB
const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('buildlens', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('blobs');
        d.createObjectStore('builds', { keyPath: 'id' });
        d.createObjectStore('log', { keyPath: 'id', autoIncrement: true });
      };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(store, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const s = t.objectStore(store);
      let out; const r = fn(s); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  put(store, val, key) { return this.tx(store, 'readwrite', s => key === undefined ? s.put(val) : s.put(val, key)); },
  get(store, key) { return this.tx(store, 'readonly', s => s.get(key)); },
  del(store, key) { return this.tx(store, 'readwrite', s => s.delete(key)); },
  all(store) { return this.tx(store, 'readonly', s => s.getAll()); },

async function putBlob(blob) { const k = 'b_' + uid(); await DB.put('blobs', blob, k); return k; }
const getBlob = k => DB.get('blobs', k);
const bitmapCache = new Map();
async function getBitmap(k) {
  if (bitmapCache.has(k)) { const p = bitmapCache.get(k); bitmapCache.delete(k); bitmapCache.set(k, p); return p; }
  const p = getBlob(k).then(b => { if (!b) throw new Error('Missing image ' + k); return createImageBitmap(b); });
  bitmapCache.set(k, p);
  while (bitmapCache.size > 6) { const [old, op] = bitmapCache.entries().next().value; bitmapCache.delete(old); op.then(b => b.close?.()).catch(() => {}); } // keep memory low on phones
  return p;
}
const urlCache = new Map();
async function blobUrl(k) {
  if (!urlCache.has(k)) { const b = await getBlob(k); if (!b) return ''; urlCache.set(k, URL.createObjectURL(b)); }
  return urlCache.get(k);
}
function blobToB64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(r.error); r.readAsDataURL(blob); });
}

// ---------------------------------------------------------------- images
async function decodeImage(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    const heic = /hei[cf]/i.test(file.type || '') || /\.hei[cf]$/i.test(file.name || '');
    throw new UserError(heic ? "This photo is HEIC, which this browser can't read. Please use a JPEG or PNG." : 'Could not read that image. Please try another photo.');

}
function canvasToBlob(c, q = 0.85) { return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode failed')), 'image/jpeg', q)); }
async function prepImage(file, maxEdge = MAX_EDGE, q = 0.85) {
  const bmp = await decodeImage(file);
  const s = Math.min(1, maxEdge / Math.max(bmp.width, bmp.height));
  const w = Math.max(1, Math.round(bmp.width * s)), hh = Math.max(1, Math.round(bmp.height * s));
  const c = document.createElement('canvas'); c.width = w; c.height = hh;
  c.getContext('2d').drawImage(bmp, 0, 0, w, hh);
  bmp.close?.();
  return { blob: await canvasToBlob(c, q), w, h: hh };
}
async function storePhoto(file, maxEdge = MAX_EDGE) {
  const { blob, w, h } = await prepImage(file, maxEdge);
  return { key: await putBlob(blob), w, h };
}
function normBox(b, w, hh) {
  if (!Array.isArray(b) || b.length < 4 || b.some(v => typeof v !== 'number' || !isFinite(v))) return null;
  let [x, y, bw, bh] = b;
  x = clamp(x, 0, w); y = clamp(y, 0, hh); bw = clamp(bw, 0, w - x); bh = clamp(bh, 0, hh - y);
  return bw >= 2 && bh >= 2 ? [x, y, bw, bh] : null;
}
async function cropToBlob(key, box, w, hh, pad = 0.12, maxEdge = CROP_EDGE) {
  const bmp = await getBitmap(key);
  const sx = bmp.width / w, sy = bmp.height / hh;
  const b = normBox(box, w, hh); if (!b) return null;
  const px = b[2] * pad, py = b[3] * pad;
  const x0 = clamp((b[0] - px) * sx, 0, bmp.width), y0 = clamp((b[1] - py) * sy, 0, bmp.height);
  const x1 = clamp((b[0] + b[2] + px) * sx, 0, bmp.width), y1 = clamp((b[1] + b[3] + py) * sy, 0, bmp.height);
  const cw = x1 - x0, ch = y1 - y0; if (cw < 4 || ch < 4) return null;
  const s = Math.min(1, maxEdge / Math.max(cw, ch));
  const c = document.createElement('canvas'); c.width = Math.round(cw * s); c.height = Math.round(ch * s);
  c.getContext('2d').drawImage(bmp, x0, y0, cw, ch, 0, 0, c.width, c.height);
  return { blob: await canvasToBlob(c, 0.85), w: c.width, h: c.height };
}

// ---------------------------------------------------------------- pdf
let pdfjsP = null;
function loadPdfjs() {
  if (!pdfjsP) pdfjsP = import(PDFJS_URL).then(m => { m.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; return m; })
    .catch(e => { pdfjsP = null; throw new UserError('Could not load the PDF reader. Check your connection, or photograph the pages instead.'); });
  return pdfjsP;
}
async function openPdf(file) {
  const pdfjs = await loadPdfjs();
  try { return await pdfjs.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise; }
  catch (e) { throw new UserError('Could not open that PDF. It may be damaged or password protected.'); }
}
async function renderPdfPages(doc, from, to, onProgress) {
  const out = [];
  for (let p = from; p <= to; p++) {
    onProgress?.(p - from + 1, to - from + 1);
    const page = await doc.getPage(p);
    const vp1 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: PAGE_EDGE / Math.max(vp1.width, vp1.height) });
    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    const blob = await canvasToBlob(c, 0.82);
    out.push({ key: await putBlob(blob), w: c.width, h: c.height, pdfPage: p });
    page.cleanup();
  }
  return out;
}

// ---------------------------------------------------------------- hashing
async function hashPages(pages) {
  const parts = [];
  for (const p of pages) { const b = await getBlob(p.key); parts.push(new Uint8Array(await b.arrayBuffer())); parts.push(new TextEncoder().encode('|' + p.source + '|')); }
  const total = parts.reduce((a, b) => a + b.length, 0); const all = new Uint8Array(total); let o = 0;
  for (const x of parts) { all.set(x, o); o += x.length; }
  if (crypto?.subtle) {
    const d = await crypto.subtle.digest('SHA-256', all);
    return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let hsh = 2166136261; for (const b of all) { hsh ^= b; hsh = Math.imul(hsh, 16777619); } // FNV-1a fallback (non-secure contexts)

}
// A hash of the rendered pages changes if rendering changes, so we also key PDFs by file bytes.
async function hashFiles(files) {
  const bufs = await Promise.all(files.map(f => f.arrayBuffer()));
  const all = new Uint8Array(bufs.reduce((a, b) => a + b.byteLength, 0)); let o = 0;
  for (const b of bufs) { all.set(new Uint8Array(b), o); o += b.byteLength; }
  if (crypto?.subtle) { const d = await crypto.subtle.digest('SHA-256', all); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join(''); }
  let hsh = 2166136261; for (const b of all) { hsh ^= b; hsh = Math.imul(hsh, 16777619); } return 'fnv' + (hsh >>> 0).toString(16) + '_' + all.length;
}
const GUIDE_CACHE = 'bl:guides';
const guideCache = { all() { return lsGet(GUIDE_CACHE) || {}; }, get(k) { return this.all()[k] || null; },
  set(k, v) { const a = this.all(); a[k] = v; lsSet(GUIDE_CACHE, a); }, del(k) { const a = this.all(); delete a[k]; lsSet(GUIDE_CACHE, a); } };

// ---------------------------------------------------------------- Claude API
function priceFor(model) {
  const s = Settings.load(); const key = Object.keys(s.prices).find(k => model && model.startsWith(k));
  return s.prices[key] || [0, 0];
}
function costOf(model, u = {}) {
  const [pi, po] = priceFor(model);
  return ((u.input_tokens || 0) * pi + (u.cache_creation_input_tokens || 0) * pi * 1.25 + (u.cache_read_input_tokens || 0) * pi * 0.1 + (u.output_tokens || 0) * po) / 1e6;
}
async function readSSE(resp, onProgress) {
  const reader = resp.body.getReader(); const dec = new TextDecoder();
  let buf = '', text = '', usage = {}, stop = null, model = null, err = null;
  const handle = (raw) => {
    const data = raw.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trimStart()).join('\n');
    if (!data) return; let ev; try { ev = JSON.parse(data); } catch { return; }
    switch (ev.type) {
      case 'message_start': usage = { ...(ev.message?.usage || {}) }; model = ev.message?.model || model; break;
      case 'content_block_start': if (ev.content_block?.type === 'fallback') text = ''; break; // a fallback model restarts the answer

      case 'error': err = ev.error || { message: 'Unknown streaming error' }; break;

// ---------------------------------------------------------------- prompts
const STEP_RULES = `You are guiding a non-expert who is holding a phone. Use the part letters and hardware numbers from the guide.
Rules:
- Only box things you can see in this photo. If a needed part is not visible, list it in notVisible and never guess a box.
- Identify parts by matching the inventory reference crops when provided, not by general appearance.
- If the photo is too dark, blurry, or cropped to judge, return retakeHint with one concrete instruction (e.g. "step back so both panels are in frame"). Otherwise retakeHint is null.
- One action per instruction, 30 words or less, referencing what is visible ("the panel by your left foot").
- Boxes are [x, y, width, height] in pixels of the PHOTO as sent (its size is given). confidence is 0 to 1; use under 0.5 when unsure.
- Never state a vehicle-specific fact (tether anchor location, lower-anchor seating positions, belt locking, inflatable belts, headrest removal) unless it comes from the guide's vehicleFacts (taken from a vehicle manual). Otherwise tell the user to confirm it by hand.
- In checkStep, never return pass for anything listed in humanChecks. Those are for the user to confirm by hand.`;
const PARSE_SYSTEM = `You turn an assembly or installation manual into a structured step-by-step guide.
- Read every page including wordless diagrams. Number steps exactly as the manual does.
- Page images are labeled "Manual page N" (and "Vehicle manual page N" for vehicle pages). manualPage is that N for the step's drawing. manualBox is the [x, y, width, height] of that step's drawing on that page image, in that image's pixels; [0,0,0,0] if unclear.
- Split install modes (e.g. rear-facing with lower anchors, rear-facing with seat belt, forward-facing, booster) into modes; each step lists the mode ids it applies to (empty list = all modes).
- parts use the manual's letters (A, B, ...) as id; hardware uses the manual's numbers as id. sizeHint describes size and look; visualCues says how to tell a part from lookalikes.
- checkCriteria: things a photo can verify. humanChecks: things only a hands-on check can verify (tightness, harness pinch test, recline indicator, cam locks turned, screws fully tight), each with a one-line howTo.
- vehicleFacts: ONLY facts read from vehicle manual pages, with vehicleManual page number. If no vehicle manual pages were given, return an empty list, and for every step that depends on the car (tether anchor, lower anchor positions, belt locking, inflatable belts, headrest removal) add a humanCheck with a how-to (e.g. "Find the tether anchor symbol on the seat back or rear shelf. It is not a cargo hook."). Never state vehicle facts from general knowledge.
- Keep instructions plain and short.`;

function guideForCalls(build) {
  const g = build.guide; if (!g) return '';
  const steps = activeSteps(build);
  return JSON.stringify({ product: g.product, mode: build.modeId || null, parts: g.parts, hardware: g.hardware, tools: g.tools, vehicleFacts: g.vehicleFacts,
    vehicle: build.category === 'car_seat' ? build.vehicle : undefined, steps: steps.map(s => ({ n: s.n, title: s.title, instruction: s.instruction, parts: s.parts, hardware: s.hardware, tools: s.tools, cautions: s.cautions, checkCriteria: s.checkCriteria, humanChecks: s.humanChecks })) });
}

async function manualCropBlock(build, step) {
  const p = (build.pages || []).filter(x => x.source === 'seat')[step.manualPage - 1];
  if (!p) return null;
  const box = normBox(step.manualBox, p.w, p.h);
  if (box) { const c = await cropToBlob(p.key, box, p.w, p.h, 0.04, 1400); if (c) return { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: await blobToB64(c.blob) } }; }
  return imgBlock(p.key);
}

async function apiParseManual(build, signal, onProgress) {
  const s = Settings.load(); const content = [];
  const v = build.vehicle || {};
  content.push({ type: 'text', text: `Product category chosen by the user: ${build.category}.` + (build.category === 'car_seat' ? ` Vehicle: ${v.year || '?'} ${v.make || '?'} ${v.model || '?'}. Vehicle manual pages provided: ${build.pages.some(p => p.source === 'vehicle') ? 'yes' : 'no'}.` : '') });

    content.push(await imgBlock(p.key));

  content.push({ type: 'text', text: 'Return the complete guide.' });

async function apiCheckStep(build, step, photo, signal) {
  const s = Settings.load(); const content = [];

async function addManualFiles(files, source) {
  const pdfs = files.filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name)); const imgs = files.filter(f => !pdfs.includes(f));
  const added = [];
  await busy('Adding pages…', async (sig, sub) => {
    for (const f of pdfs) {
      const doc = await openPdf(f); let from = 1, to = doc.numPages;
      if (doc.numPages > RANGE_OVER) {
        const r = await askRange(doc.numPages, f.name); if (!r) continue; [from, to] = r;
      }
      const pages = await renderPdfPages(doc, from, to, (i, n) => sub(`Page ${i} of ${n}`));
      for (const p of pages) added.push({ ...p, source, file: f.name });
      build.fileHashes = [...(build.fileHashes || []), await hashFiles([f]) + `:${from}-${to}`];
    }
    for (const f of imgs) { const p = await storePhoto(f, PAGE_EDGE); added.push({ ...p, source, file: f.name }); }
  });
  build.pages.push(...added);
  if (build.pages.length > MAX_PAGES) { build.pages = build.pages.slice(0, MAX_PAGES); showError(new UserError(`Only the first ${MAX_PAGES} pages are kept. Remove pages you don't need, such as other languages.`)); }
  await saveBuild();
}

async function readManual() {

  } else {
    app.append(h('p', { class: 'muted small' }, 'Tap a tag to confirm or fix it.'));
    if (r.missing.length) app.append(h('div', { class: 'banner warn', id: 'missing' }, 'Not found in the photo: ' + r.missing.join(', ')));
  }
  setBar([h('button', { class: 'btn primary block', id: 'invOk', onclick: () => guarded(finishInventory) }, 'Looks right')],
    [h('button', { class: 'btn', onclick: () => guarded(async () => { inv.photo = null; inv.result = null; await saveBuild(); render(); }) }, 'Retake'), h('button', { class: 'btn', onclick: () => guarded(scanInventory) }, 'Scan again')]);
};
async function scanInventory() {
  const inv = build.inventory;
  const r = await busy('Finding the parts…', sig => apiScanInventory(build, inv.photo, sig));
  inv.result = { items: r.items || [], missing: r.missing || [], uncertain: r.uncertain || [], vehicleMarks: r.vehicleMarks || [], retakeHint: r.retakeHint };
  await saveBuild(); render();
}
function correctTag(hit, r, stage) {
  const ids = [...(build.guide.parts || []).map(p => p.id), ...(build.guide.hardware || []).map(p => p.id)];
  const apply = async ref => {
    if (hit.kind === 'item') { if (ref) { r.items[hit.idx].ref = ref; r.items[hit.idx].confidence = 1; } else r.items.splice(hit.idx, 1); }
    else { const u = r.uncertain.splice(hit.idx, 1)[0]; if (ref) r.items.push({ ref, box: u.box, confidence: 1 }); }
    r.missing = r.missing.filter(m => m !== ref);
    await logEvent({ type: 'correction', buildId: build.id, call: 'scanInventory', model: Settings.load().models.inventory, to: ref });
    await saveBuild(); closeModal(); stage.redraw();
  };
  modal([h('h2', {}, 'Which part is this?'), h('div', { class: 'chips' }, ids.map(id => h('button', { class: 'btn', 'data-tag': id, onclick: () => apply(id) }, id))),
    h('div', { class: 'row', style: 'margin-top:12px' }, h('button', { class: 'btn grow', onclick: () => apply(null) }, 'Not a part'), h('button', { class: 'btn grow', onclick: closeModal }, 'Cancel'))]);
}
async function finishInventory() {
  const inv = build.inventory || {}; inv.crops = [];
  if (inv.photo && inv.result) {
    const seen = new Set();
    await busy('Saving part references…', async () => {
      for (const it of inv.result.items) {
        if (seen.has(it.ref) || (it.confidence ?? 1) < LOW_CONF) continue;
        const c = await cropToBlob(inv.photo.key, it.box, inv.photo.w, inv.photo.h); if (!c) continue;
        inv.crops.push({ ref: it.ref, key: await putBlob(c.blob), w: c.w, h: c.h }); seen.add(it.ref);
      }
    });
  }
  build.inventory = inv; build.stepIndex = 0; build.phase = 'GRAB'; setState('STEP'); await saveBuild(); go('step');
}

// ---- step screen
const PHASES = [['GRAB', 'Grab'], ['PLACE', 'Place'], ['CHECK', 'Check'], ['HANDS_ON', 'Hands-on']];
SCREENS.step = async app => {
  const steps = activeSteps(); const step = steps[build.stepIndex];
  if (!step) { setState('DONE'); await saveBuild(); return go('finished'); }
  const sd = stepData(); const car = build.category === 'car_seat';
  const phases = build.job === 'check' ? PHASES.slice(2) : PHASES;
  if (!(step.humanChecks?.length) && build.phase === 'HANDS_ON') build.phase = 'CHECK';
  const pi = phases.findIndex(p => p[0] === build.phase);
  app.append(h('div', { class: 'steps-nav' },
    h('button', { class: 'iconbtn', id: 'prevStep', disabled: build.stepIndex === 0, 'aria-label': 'Previous step', onclick: () => moveStep(-1) }, '◀'),
    h('div', { class: 'grow' }, h('b', { id: 'stepHeader' }, `Step ${build.stepIndex + 1} of ${steps.length}: ${step.title}`)),
    h('button', { class: 'iconbtn', id: 'nextStepNav', disabled: build.stepIndex >= steps.length - 1, 'aria-label': 'Next step', onclick: () => moveStep(1) }, '▶')));
  app.append(h('div', { class: 'phases' }, phases.filter(p => p[0] !== 'HANDS_ON' || step.humanChecks?.length).map((p, i) => h('span', { class: i === pi ? 'on' : i < pi ? 'done' : '' }, p[1]))));
  if (step.cautions?.length) app.append(h('div', { class: 'banner warn' }, '⚠ ' + step.cautions.join(' ')));
  const phase = build.phase;
  if (phase === 'GRAB' || phase === 'PLACE') return phaseGuide(app, step, sd, phase === 'GRAB' ? 'grab' : 'place');
  if (phase === 'CHECK') return phaseCheck(app, step, sd, car);
  return phaseHandsOn(app, step, sd, car);
};
async function moveStep(d) {
  const n = activeSteps().length; build.stepIndex = clamp(build.stepIndex + d, 0, n - 1);
  build.phase = build.job === 'check' ? 'CHECK' : 'GRAB'; ui = {}; await saveBuild(); render();
}
async function setPhase(p) { build.phase = p; ui = {}; await saveBuild(); render(); window.scrollTo(0, 0); }
async function nextStep() {
  const n = activeSteps().length;
  if (build.stepIndex >= n - 1) { setState('DONE'); await saveBuild(); return go('finished'); }
  build.stepIndex++; build.phase = build.job === 'check' ? 'CHECK' : 'GRAB'; ui = {}; await saveBuild(); render(); window.scrollTo(0, 0);
}
function chipsFor(step) {
  return h('div', { class: 'chips' },
    (step.hardware || []).map(hw => h('span', { class: 'chip a' }, `${hw.qty} × ${hw.id}`)),
    (step.tools || []).map(t => h('span', { class: 'chip' }, '🔧 ' + t)));
}
async function phaseGuide(app, step, sd, ph) {
  const rec = sd[ph]; const inset = await insetView(build, step);
  const takePhoto = cam => () => guarded(async () => {
    const f = await pickFiles({ camera: cam, accept: 'image/*' }); if (!f.length) return;
    const photo = await busy('Preparing photo…', () => storePhoto(f[0]));
    sd[ph] = { photo, overlay: null }; await saveBuild(); await runGuide(step, sd, ph);
  });
  if (!rec?.photo) {
    app.append(h('p', { class: 'instr' }, step.instruction), chipsFor(step));
    if (inset) { inset.style.position = 'static'; inset.style.width = '60%'; app.append(h('div', { class: 'muted small' }, "Manual drawing:"), inset); }
    app.append(h('p', { class: 'muted' }, ph === 'grab' ? 'Take a photo of the parts pile so I can show you what to grab.' : 'Now take a photo of the build where the parts go.'));
    setBar([h('button', { class: 'btn primary block', id: 'takePhoto', onclick: takePhoto(true) }, ph === 'grab' ? 'Take grab photo' : 'Take place photo')],
      [h('button', { class: 'btn', id: 'uploadPhoto', onclick: takePhoto(false) }, 'Upload'),
        ph === 'grab' ? h('button', { class: 'btn', id: 'skipGrab', onclick: () => setPhase('PLACE') }, 'I have the parts') : h('button', { class: 'btn', id: 'skipPlace', onclick: () => setPhase('CHECK') }, 'Skip to check'),
        speakerBtn(step.instruction)]);
    return;
  }
  if (!rec.overlay) {
    app.append(h('div', { class: 'banner warn' }, 'This photo has no guidance yet.'));
    setBar([h('button', { class: 'btn primary block', id: 'runGuide', onclick: () => guarded(() => runGuide(step, sd, ph)) }, 'Get guidance')], [h('button', { class: 'btn', onclick: takePhoto(true) }, 'Retake')]);
    return;
  }
  const o = rec.overlay;
  const stage = stageView({ photo: rec.photo, inset, getScene: () => shapesFromOverlay(o, rec.photo.w, rec.photo.h), onTap: (x, y, hit) => onStageTap(x, y, hit, step, sd, ph, o, stage) });
  // instruction first, so it is readable without scrolling past the photo
  app.append(h('div', { class: 'row' }, h('p', { class: 'instr grow', id: 'instruction' }, o.instruction || step.instruction), speakerBtn(o.instruction || step.instruction)));
  if (ui.wrongMode) app.append(h('div', { class: 'banner info', id: 'wrongHint' }, 'Tap the right part in the photo.'));
  if (o.retakeHint) app.append(h('div', { class: 'banner warn', id: 'retakeHint' }, '📷 ' + o.retakeHint));
  app.append(stage, chipsFor(step));
  if (o.notVisible?.length) app.append(h('div', { class: 'banner warn', id: 'notVisible' }, 'Not in this photo: ' + o.notVisible.join(', ')));
  const fb = sd.feedback[ph];
  const setFb = async v => { sd.feedback[ph] = v; await saveBuild(); await logEvent({ type: 'feedback', buildId: build.id, step: step.n, phase: ph, model: o._model || Settings.load().models.step, right: v }); render(); };
  app.append(h('div', { class: 'fb', id: 'feedback' }, h('span', { class: 'muted' }, 'Was this right?'),
    h('button', { class: 'btn' + (fb === true ? ' sel' : ''), id: 'fbYes', onclick: () => setFb(true) }, '👍'),
    h('button', { class: 'btn' + (fb === false ? ' sel' : ''), id: 'fbNo', onclick: () => setFb(false) }, '👎')));
  const primary = ph === 'grab'
    ? h('button', { class: 'btn primary block', id: 'toPlace', onclick: () => setPhase('PLACE') }, 'Next: where it goes')
    : h('button', { class: 'btn primary block', id: 'checkWork', onclick: () => setPhase('CHECK') }, 'Check my work');
  setBar([primary], [
    h('button', { class: 'btn', id: 'retake', onclick: takePhoto(true) }, 'Retake'),
    h('button', { class: 'btn', id: 'wrongPart', onclick: () => { ui.wrongMode = !ui.wrongMode; render(); } }, ui.wrongMode ? 'Cancel' : 'Wrong part'),
    h('button', { class: 'btn', id: 'toggleOverlay', onclick: () => { ui.showOverlay = ui.showOverlay === false; stage.redraw(); } }, 'Overlay'),
  ]);
}
async function runGuide(step, sd, ph, hint) {
  const rec = sd[ph];
  const o = await busy(ph === 'grab' ? `Finding ${[...(step.parts || []), ...(step.hardware || []).map(x => x.id)].slice(0, 3).join(', ') || 'the parts'}…` : 'Finding where it goes…', sig => apiGuideStep(build, step, ph, rec.photo, hint, sig));
  o._model = Settings.load().models.step; rec.overlay = o; ui.wrongMode = false;
  await saveBuild(); render();
}
function onStageTap(x, y, hit, step, sd, ph, o, stage) {
  if (ui.wrongMode) {
    const hint = `The user says the correct part for this step is at about (${Math.round(x)}, ${Math.round(y)}) in the photo. Box that part instead.`;
    logEvent({ type: 'correction', buildId: build.id, step: step.n, phase: ph, call: 'guideStep', model: Settings.load().models.step, at: [Math.round(x), Math.round(y)] });
    sd.corrections = (sd.corrections || 0) + 1;
    return guarded(() => runGuide(step, sd, ph, hint));
  }
  if (hit?.low) {
    modal([h('h2', {}, `Is this ${hit.label}?`), h('div', { class: 'row' },
      h('button', { class: 'btn primary grow', id: 'confirmYes', onclick: async () => { hit.ref.confidence = 1; await saveBuild(); closeModal(); stage.redraw(); } }, 'Yes'),
      h('button', { class: 'btn grow', id: 'confirmNo', onclick: () => { closeModal(); ui.wrongMode = true; render(); } }, 'No, show me'))]);
  }
}
async function phaseCheck(app, step, sd, car) {
  const rec = sd.check; const inset = await insetView(build, step);
  const takePhoto = cam => () => guarded(async () => {
    const f = await pickFiles({ camera: cam, accept: 'image/*' }); if (!f.length) return;
    const photo = await busy('Preparing photo…', () => storePhoto(f[0]));
    sd.check = { photo, result: null }; await saveBuild(); await runCheck(step, sd);
  });
  if (!rec?.photo || !rec.result) {
    app.append(h('p', { class: 'instr' }, build.job === 'check' ? step.instruction : 'Take a photo of your work so I can check it.'));
    if (step.checkCriteria?.length) app.append(h('div', { class: 'card' }, h('b', {}, 'I will check:'), h('ul', { class: 'plain' }, step.checkCriteria.map(c => h('li', {}, c)))));
    if (inset) { inset.style.position = 'static'; inset.style.width = '60%'; app.append(inset); }
    const prim = rec?.photo && !rec.result ? h('button', { class: 'btn primary block', id: 'runCheck', onclick: () => guarded(() => runCheck(step, sd)) }, 'Check this photo')
      : h('button', { class: 'btn primary block', id: 'takeCheck', onclick: takePhoto(true) }, 'Take check photo');
    setBar([prim], [h('button', { class: 'btn', id: 'uploadCheck', onclick: takePhoto(false) }, 'Upload'),
      build.job !== 'check' ? h('button', { class: 'btn', onclick: () => setPhase('PLACE') }, 'Back') : null]);
    return;
  }
  const r = rec.result;
  const scene = () => ({ shapes: r.verdict === 'fix' ? (r.issues || []).map(i => ({ box: normBox(i.box, rec.photo.w, rec.photo.h), color: COLORS.issue, fill: true, label: i.problem })).filter(s => s.box) : [], arrows: [] });
  app.append(stageView({ photo: rec.photo, inset, getScene: scene }));
  const afterPass = () => step.humanChecks?.length ? setPhase('HANDS_ON') : nextStep();
  if (r.verdict === 'pass') {
    app.append(h('div', { class: 'banner ok', id: 'verdict' }, '✓ Looks right. ' + (r.summary || '')));
    if (step.humanChecks?.length) app.append(h('p', { class: 'muted' }, 'Some things can only be checked by hand. That comes next.'));
    setBar([h('button', { class: 'btn primary block', id: 'afterPass', onclick: afterPass }, step.humanChecks?.length ? 'Next: hands-on checks' : 'Next step')], [h('button', { class: 'btn', onclick: takePhoto(true) }, 'Check again')]);
  } else if (r.verdict === 'fix') {
    app.append(h('div', { class: 'banner bad', id: 'verdict' }, '✕ Needs a fix. ' + (r.summary || '')),
      h('ul', { class: 'plain', id: 'fixes' }, (r.issues || []).map(i => h('li', {}, h('b', {}, i.problem), ' — ', i.fix))));
    const override = car
      ? h('button', { class: 'btn', id: 'override', onclick: () => confirmOverride(step, sd, afterPass) }, 'I checked it by hand')
      : h('button', { class: 'btn', id: 'override', onclick: async () => { await logEvent({ type: 'override', buildId: build.id, step: step.n }); afterPass(); } }, "It's fine, continue");
    setBar([h('button', { class: 'btn primary block', id: 'tryAgain', onclick: takePhoto(true) }, 'Try again')],
      [build.job !== 'check' ? h('button', { class: 'btn', id: 'redoStep', onclick: async () => { sd.grab = null; sd.place = null; sd.check = null; await setPhase('GRAB'); } }, 'Redo step') : null, override]);
  } else {
    app.append(h('div', { class: 'banner warn', id: 'verdict' }, '? Not sure. ' + (r.retakeHint || r.summary || 'Try another angle.')));
    setBar([h('button', { class: 'btn primary block', id: 'retakeCheck', onclick: takePhoto(true) }, 'Retake check photo')], [override2(step, sd, car, afterPass)]);
  }
}
function override2(step, sd, car, afterPass) {
  return car ? h('button', { class: 'btn', id: 'override', onclick: () => confirmOverride(step, sd, afterPass) }, 'I checked it by hand')
    : h('button', { class: 'btn', id: 'override', onclick: afterPass }, "It's fine, continue");
}
function confirmOverride(step, sd, then) {
  const cb = h('input', { type: 'checkbox', id: 'overrideConfirm' });
  const ok = h('button', { class: 'btn primary grow', id: 'overrideOk', disabled: true, onclick: async () => { sd.override = true; await logEvent({ type: 'override', buildId: build.id, step: step.n }); await saveBuild(); closeModal(); then(); } }, 'Continue');
  cb.onchange = () => { ok.disabled = !cb.checked; };
  modal([h('h2', {}, 'Confirm by hand'), h('p', {}, 'The photo check did not pass. Only continue if you have checked this step yourself against the car seat manual.'),
    h('label', { class: 'check' }, cb, h('span', {}, 'I checked this step by hand and it matches the manual.')),
    h('div', { class: 'row' }, ok, h('button', { class: 'btn grow', onclick: closeModal }, 'Cancel'))]);
}
async function runCheck(step, sd) {
  const r = await busy('Checking your work…', sig => apiCheckStep(build, step, sd.check.photo, sig));
  if (r.verdict === 'pass' && step.humanChecks?.length && false) {} // humanChecks are never passed from a photo: they always follow as a checklist
  sd.check.result = r; if (r.verdict === 'fix') sd.fixes = (sd.fixes || 0) + 1;
  await logEvent({ type: 'check', buildId: build.id, step: step.n, verdict: r.verdict, model: Settings.load().models.check });
  await saveBuild(); render();
}
async function phaseHandsOn(app, step, sd, car) {
  app.append(h('h2', {}, 'Hands-on checks'), h('p', { class: 'muted' }, 'A photo can’t judge these. Do each one and tick it.'));
  const items = step.humanChecks || [];
  const all = () => items.every((_, i) => sd.handsOn[i]);
  const next = h('button', { class: 'btn primary block', id: 'handsOnDone', disabled: car && !all(), onclick: async () => {
    if (!all() && !confirm('Some checks are not ticked. Continue anyway?')) return; await nextStep(); } }, build.stepIndex >= activeSteps().length - 1 ? 'Finish' : 'Next step');
  items.forEach((c, i) => {
    const cb = h('input', { type: 'checkbox', 'data-hc': i, checked: !!sd.handsOn[i], onchange: async e => { sd.handsOn[i] = e.target.checked; next.disabled = car && !all(); await saveBuild(); } });
    app.append(h('label', { class: 'check' }, cb, h('span', {}, h('b', {}, c.check), h('span', { class: 'muted small' }, c.howTo))));
  });
  if (car) app.append(h('p', { class: 'muted small' }, 'All checks must be ticked before you can move on.'));
  setBar([next], [h('button', { class: 'btn', onclick: () => setPhase('CHECK') }, 'Back')]);
}

SCREENS.finished = async app => {
  const car = build.category === 'car_seat'; const steps = activeSteps();
  const log = (await DB.all('log')).filter(e => e.buildId === build.id);
  const cost = log.filter(e => e.type === 'call').reduce((a, e) => a + (e.cost || 0), 0);
  const fixed = steps.map((s, i) => ({ s, d: build.stepData?.[i] })).filter(x => x.d?.fixes);
  const fb = log.filter(e => e.type === 'feedback'); const right = fb.filter(e => e.right).length;
  app.append(h('h2', {}, car ? 'Install steps complete' : 'Build complete'));
  if (car) app.append(h('div', { class: 'banner info', id: 'techBanner' }, 'Have it checked by a certified child passenger safety technician before you drive. ', h('a', { href: TECH_URL, target: '_blank', rel: 'noopener' }, 'Find a technician')));
  app.append(h('div', { class: 'card kv' },
    h('span', { class: 'muted' }, 'Steps'), h('span', {}, String(steps.length)),
    h('span', { class: 'muted' }, 'Needed a fix'), h('span', {}, fixed.length ? fixed.map(x => `Step ${x.s.n}`).join(', ') : 'None'),
    h('span', { class: 'muted' }, 'Highlights right'), h('span', {}, fb.length ? `${right} of ${fb.length} rated` : 'Not rated'),
    h('span', { class: 'muted' }, 'AI cost'), h('span', { id: 'buildCost' }, money(cost))));
  setBar([h('button', { class: 'btn primary block', id: 'backHome', onclick: () => go('home') }, 'Back to home')], [h('button', { class: 'btn', onclick: async () => { build.state = 'STEP'; await saveBuild(); go('step'); } }, 'Review steps')]);
};

SCREENS.log = async app => {
  const log = (await DB.all('log')).sort((a, b) => b.ts - a.ts);
  const calls = log.filter(e => e.type === 'call');
  const total = calls.reduce((a, e) => a + (e.cost || 0), 0);
  app.append(h('h2', {}, 'Session log'), h('p', {}, `${calls.length} AI calls · `, h('b', { id: 'logTotal' }, money(total))));
  // hit rate per model from "Was this right?" taps
  const byModel = {};
  for (const e of log.filter(e => e.type === 'feedback')) { const m = byModel[e.model] ||= { yes: 0, n: 0 }; m.n++; if (e.right) m.yes++; }
  const corr = log.filter(e => e.type === 'correction').length;
  app.append(h('div', { class: 'card' }, h('b', {}, 'Highlight hit rate by model'),
    Object.keys(byModel).length ? h('ul', { class: 'plain', id: 'hitRates' }, Object.entries(byModel).map(([m, v]) => h('li', {}, `${m}: ${v.yes} of ${v.n} right (${Math.round(100 * v.yes / v.n)}%)`))) : h('p', { class: 'muted' }, 'No ratings yet. Tap 👍 or 👎 under each overlay.'),
    h('div', { class: 'muted small' }, `${corr} corrections (Wrong part / tag fixes).`)));
  const rows = calls.slice(0, 200).map(e => h('tr', {}, h('td', {}, new Date(e.ts).toLocaleTimeString()), h('td', {}, e.call), h('td', {}, (e.servedModel || e.model || '').replace('claude-', '')),
    h('td', {}, e.usage ? `${(e.usage.input_tokens || 0) + (e.usage.cache_read_input_tokens || 0) + (e.usage.cache_creation_input_tokens || 0)} / ${e.usage.output_tokens || 0}` : '—'),
    h('td', {}, e.latencyMs ? (e.latencyMs / 1000).toFixed(1) + 's' : '—'), h('td', {}, e.ok ? money(e.cost || 0) : '✕ ' + (e.error || ''))));
  app.append(h('div', { class: 'tablewrap' }, h('table', { class: 'log' }, h('thead', {}, h('tr', {}, ['Time', 'Call', 'Model', 'Tokens in/out', 'Time', 'Cost'].map(t => h('th', {}, t)))), h('tbody', {}, rows))));
  setBar([h('button', { class: 'btn primary block', id: 'exportLog', onclick: () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(log, null, 2)], { type: 'application/json' }));
    const a = h('a', { href: url, download: `buildlens-log-${new Date().toISOString().slice(0, 10)}.json` }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
  } }, 'Export JSON')], [h('button', { class: 'btn', onclick: () => build ? go(screenFor(build)) : go('home') }, 'Back')]);
};

// ---------------------------------------------------------------- boot
$('#homeBtn').onclick = () => go('home');
$('#setBtn').onclick = () => go('settings');
$('#logBtn').onclick = () => go('log');
window.addEventListener('pagehide', () => { saveBuild().catch(() => {}); });
(async () => {
  try { await DB.open(); } catch (e) { $('#app').append(h('div', { class: 'banner bad' }, 'Storage is unavailable in this browser mode (private browsing?). BuildLens needs it to save your place.')); return; }
  const active = lsGet(BUILD_ACTIVE);
  if (active) await openBuild(active); else go('home');
})();
window.__bl = { get build() { return build; }, Settings, DB, normBox, version: 1 };
</script>
